<!doctype html>
<html lang="en">
  <head>
    <!-- Document metadata and responsive viewport configuration -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Snifr connects pet owners with trusted local dog walkers." />
    <title>Snifr — Better walks for every pet</title>

    <!-- Font families used in the Figma design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Outfit:wght@800&display=swap" rel="stylesheet" />

    <!-- Project stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body> 
     <!-- ============================================================
         PAGE SHELL
         This is the single landing page; there are no other routes.
         ============================================================ -->
    <main class="site">
      <!-- ============================================================
           HEADER / TOP NAVIGATION
           ============================================================ -->
      <header class="header">
        <div class="container header__inner">
          <a class="brand" href="#top" aria-label="Snifr home">
            <img class="brand__logo" src="assets/logo.png" alt="Snifr" />
            <span class="brand__name">Snifr</span>
          </a>

          <nav class="actions" aria-label="Account actions">
            <a class="signin" href="#get-started">Sign In | Sign Up</a>
            <a class="pill" href="#walker">Become a Walker</a>
          </nav>
        </div>
      </header>

      
  </body>
</html>
