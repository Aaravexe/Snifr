<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer dashboard | Snifr</title><link rel="stylesheet" href="/Dashboard.CSS">
</head>
<body>
  <header><a class="brand" href="/"><img src="/assets/snifr-logo.png" alt="">Snifr</a>
    <nav aria-label="Main navigation"><a href="/walkers">Find walkers</a><a href="/my-bookings">My bookings</a><button id="logout" class="quiet">Sign out</button></nav>
  </header>
  <main>
    <div class="intro"><div><h1>Consumer dashboard</h1><p id="greeting" aria-live="polite"></p></div><img src="/assets/dog-walk.png" alt=""></div>
    <p id="notice" role="status"></p>
    <div class="grid">
      <section class="panel" aria-labelledby="pets-title"><div class="panel-head"><h2 id="pets-title">My pets</h2><button id="add-pet">Add pet</button></div>
        <div id="pets" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="upcoming-title"><div class="panel-head"><h2 id="upcoming-title">Upcoming bookings</h2></div>
        <div id="upcoming" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="walkers-title"><div class="panel-head"><h2 id="walkers-title">Recommended walkers</h2></div>
        <div id="walkers" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="history-title"><div class="panel-head"><h2 id="history-title">Booking history</h2></div>
        <div id="history" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="reviews-title"><div class="panel-head"><h2 id="reviews-title">My reviews</h2></div>
        <div id="reviews" aria-live="polite">Loading…</div>
      </section>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2>
    <div id="fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="close" class="quiet">Cancel</button><button id="save">Save</button></div>
  </form></dialog>
  <script type="module" src="/consumer-dashboard.js"></script>
</body></html>
