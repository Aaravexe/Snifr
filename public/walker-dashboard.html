<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walker dashboard | Snifr</title><link rel="stylesheet" href="/Dashboard.CSS">
</head>
<body>
  <header><a class="brand" href="/"><img src="/assets/snifr-logo.png" alt="">Snifr</a>
    <nav aria-label="Main navigation"><a href="/walker-settings">Profile settings</a><a href="/walker-availability">Availability</a><a href="/walker-bookings">Bookings</a><button id="logout" class="quiet">Sign out</button></nav>
  </header>
  <main>
    <div class="intro"><div><h1>Walker dashboard</h1><p id="greeting" aria-live="polite"></p></div><img src="/assets/dog-walk.png" alt=""></div>
    <p id="notice" role="status"></p>
    <div class="grid">
      <section class="panel" aria-labelledby="profile-title"><div class="panel-head"><h2 id="profile-title">Profile status</h2></div>
        <div id="profile" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="summary-title"><div class="panel-head"><h2 id="summary-title">Walk summary</h2></div>
        <div id="summary" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="dates-title"><div class="panel-head"><h2 id="dates-title">Available dates</h2></div>
        <div id="dates" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="requests-title"><div class="panel-head"><h2 id="requests-title">Booking requests</h2></div>
        <div id="requests" aria-live="polite">Loading…</div>
      </section>
      <section class="panel" aria-labelledby="upcoming-title"><div class="panel-head"><h2 id="upcoming-title">Upcoming walks</h2></div>
        <div id="upcoming" aria-live="polite">Loading…</div>
      </section>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2>
    <div id="fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="close" class="quiet">Cancel</button><button id="save">Save</button></div>
  </form></dialog>
  <script type="module" src="/walker-dashboard.js"></script>
</body></html>
