<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard | Snifr</title><link rel="stylesheet" href="/Dashboard.CSS">
</head>
<body>
  <header><a class="brand" href="/"><img src="/assets/snifr-logo.png" alt="">Snifr</a>
    <nav aria-label="Main navigation"><a href="/">Home</a><button id="logout" class="quiet">Sign out</button></nav>
  </header>
  <main>
    <div class="intro"><div><h1>Admin dashboard</h1><p id="greeting" aria-live="polite"></p></div><img src="/assets/dog-walk.png" alt=""></div>
    <p id="notice" role="status"></p>
    <section class="panel"><nav id="tabs" aria-label="Collections"></nav>
      <div class="panel-head"><h2 id="collection">Users</h2><button id="add">Add record</button></div>
      <div id="parent"></div><div id="records" aria-live="polite">Loading…</div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2>
    <div id="fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="close" class="quiet">Cancel</button><button id="save">Save</button></div>
  </form></dialog>
  <script type="module" src="/admin.js"></script>
</body></html>
